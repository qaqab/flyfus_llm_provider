model: gemini-3.7-flash
label:
  zh_Hans: gemini-3.7-flash
  en_US: gemini-3.7-flash
model_type: llm
features:
- agent-thought
- vision
- document
- tool-call
model_properties:
  mode: chat
  context_size: 1047000
parameter_rules:
- name: thinking_level
  label:
    en_US: Thinking Level
    zh_Hans: 思考层级
  type: string
  default: medium
  options:
  - low
  - medium
  - high
  required: false
  help:
    zh_Hans: 控制模型推理深度。Gemini 3.7 默认 Medium。
    en_US: Controls the model reasoning depth. Gemini 3.7 defaults to Medium.
- name: enable_web_search
  type: boolean
  required: false
  default: false
  label:
    en_US: Web search
    zh_Hans: 联网搜索
  help:
    zh_Hans: 请求 Gemini 原生 Google Search；不能与函数工具同时启用，结果仍需核验。
    en_US: Requests native Google Search; it cannot be combined with function tools and results still require verification.
pricing:
  input: '0'
  output: '0'
  unit: '0.000001'
  currency: USD
extra:
  thinking:
    mode: gemini
