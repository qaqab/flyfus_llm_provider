model: gemini-3.5-flash
label:
  zh_Hans: gemini-3.5-flash
  en_US: gemini-3.5-flash
model_type: llm
features:
- agent-thought
- vision
- document
- tool-call
- multi-tool-call
- stream-tool-call
- video
- audio
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
- name: temperature
  use_template: temperature
  default: 1
  min: 0
  max: 2
- name: top_p
  use_template: top_p
- name: response_format
  use_template: response_format
  options:
  - text
  - json_object
  - json_schema
- name: json_schema
  use_template: json_schema
- name: thinking_level
  label:
    en_US: Thinking Level
    zh_Hans: 思考层级
  type: string
  default: High
  options:
  - Minimal
  - Low
  - Medium
  - High
  required: false
  help:
    zh_Hans: 控制模型推理深度。Gemini 3 默认 High。
    en_US: Controls the model reasoning depth. Gemini 3 defaults to High.
pricing:
  input: '0'
  output: '0'
  unit: '0.000001'
  currency: USD
extra:
  thinking:
    mode: gemini
