model: gemini-3.6-flash
label:
  zh_Hans: gemini-3.6-flash
  en_US: gemini-3.6-flash
model_type: llm
features:
- agent-thought
- vision
- document
- tool-call
- multi-tool-call
- stream-tool-call
model_properties:
  mode: chat
  context_size: 750000
parameter_rules:
- name: temperature
  use_template: temperature
  default: 1
  min: 0
  max: 2
- name: top_p
  use_template: top_p
- name: response_format
  use_template: response_format
  options:
  - text
  - json_object
  - json_schema
- name: json_schema
  use_template: json_schema
- name: thinking_level
  label:
    en_US: Thinking Level
    zh_Hans: 思考层级
  type: string
  default: Low
  options:
  - Minimal
  - Low
  - Medium
  - High
  required: false
  help:
    zh_Hans: 控制模型推理深度。
    en_US: Controls the model reasoning depth.
- name: enable_web_search
  type: boolean
  required: false
  default: false
  label:
    en_US: Web search
    zh_Hans: 联网搜索
  help:
    zh_Hans: 请求 Gemini 原生 Google Search；不能与函数工具同时启用，结果仍需核验。
    en_US: Requests native Google Search; it cannot be combined with function tools and results still require verification.
pricing:
  input: '0'
  output: '0'
  unit: '0.000001'
  currency: USD
extra:
  thinking:
    mode: gemini
