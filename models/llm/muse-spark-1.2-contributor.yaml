model: muse-spark-1.2-contributor
label:
  zh_Hans: muse-spark-1.2-contributor
  en_US: muse-spark-1.2-contributor
model_type: llm
features:
- agent-thought
- tool-call
- multi-tool-call
- stream-tool-call
- vision
model_properties:
  mode: chat
  # Verified with a successful request containing 40013 prompt tokens.
  context_size: 65536
parameter_rules:
- name: temperature
  use_template: temperature
  default: 1
  min: 0
  max: 1.5
- name: top_p
  use_template: top_p
  default: 1
  min: 0.01
  max: 1
- name: max_tokens
  use_template: max_tokens
  default: 4096
  min: 512
  max: 32768
- name: frequency_penalty
  use_template: frequency_penalty
  default: 0
  min: -2
  max: 2
- name: presence_penalty
  use_template: presence_penalty
  default: 0
  min: -2
  max: 2
- name: response_format
  use_template: response_format
  options:
  - text
  - json_object
pricing:
  input: '0'
  output: '0'
  unit: '0.000001'
  currency: USD
