model: ling-3.0-flash
label:
  zh_Hans: ling-3.0-flash
  en_US: ling-3.0-flash
model_type: llm
features:
- agent-thought
- tool-call
- multi-tool-call
- stream-tool-call
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
- name: temperature
  use_template: temperature
  default: 1
  min: 0
  max: 2
- name: top_p
  use_template: top_p
  min: 0
  max: 1
- name: frequency_penalty
  use_template: frequency_penalty
  default: 0
  min: -2
  max: 2
- name: presence_penalty
  use_template: presence_penalty
  default: 0
  min: -2
  max: 2
- name: max_tokens
  use_template: max_tokens
  default: 32768
  min: 1
  max: 32768
- name: response_format
  use_template: response_format
  options:
  - text
  - json_object
- name: reasoning_effort
  label:
    en_US: Reasoning effort
    zh_Hans: 推理强度
  type: string
  required: false
  default: medium
  options:
  - none
  - low
  - medium
  - high
  - xhigh
extra:
  token_param_name: max_completion_tokens
pricing:
  input: '0'
  output: '0'
  unit: '0.000001'
  currency: USD
