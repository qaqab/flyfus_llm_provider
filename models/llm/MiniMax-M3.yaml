model: minimax-m3
label:
  zh_Hans: minimax-m3
  en_US: minimax-m3
model_type: llm
features:
- agent-thought
- tool-call
- multi-tool-call
- stream-tool-call
- vision
model_properties:
  mode: chat
  context_size: 204800
parameter_rules:
- name: temperature
  use_template: temperature
  default: 1
  min: 0
  max: 2
- name: top_p
  use_template: top_p
  default: 1
  min: 0.01
  max: 1
- name: max_tokens
  use_template: max_tokens
  default: 128000
  min: 1
  max: 128000
- name: frequency_penalty
  use_template: frequency_penalty
  default: 0
  min: -2
  max: 2
- name: presence_penalty
  use_template: presence_penalty
  default: 0
  min: -2
  max: 2
- name: response_format
  use_template: response_format
  options:
  - text
  - json_schema
- name: json_schema
  use_template: json_schema
pricing:
  input: '0'
  output: '0'
  unit: '0.000001'
  currency: USD
