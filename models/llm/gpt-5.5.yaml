model: gpt-5.5
label:
  zh_Hans: gpt-5.5
  en_US: gpt-5.5
model_type: llm
features:
- agent-thought
- vision
- document
- tool-call
- multi-tool-call
- stream-tool-call
model_properties:
  mode: chat
  context_size: 260000
parameter_rules:
- name: response_format
  use_template: response_format
  options:
  - text
  - json_object
  - json_schema
- name: json_schema
  use_template: json_schema
- name: reasoning_effort
  label:
    en_US: Reasoning effort
    zh_Hans: 推理强度
  type: string
  required: false
  options:
  - none
  - low
  - medium
  - high
  - xhigh
- name: enable_web_search
  label:
    zh_Hans: 联网搜索
    en_US: Web search
  type: boolean
  default: true
pricing:
  input: '5.00'
  output: '30.00'
  unit: '0.000001'
  currency: USD
